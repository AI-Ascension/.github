name: Review of record

on:
  pull_request:
    # Re-run whenever the head moves, so a push after the last review unpins
    # that review and turns the check red again on the head that would merge.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    # Re-run when a review lands, so a PR that opened with no review of record
    # turns green when it gets one instead of waiting for the next push.
    types: [submitted, edited, dismissed]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number to evaluate
        required: true
        # `number`, not `string`. GitHub coerces this to an integer before the
        # workflow runs, so a value like `$(echo ...` cannot reach the `run:`
        # block below as text. `run:` interpolates `${{ }}` into a shell
        # script, and surrounding double quotes do NOT neutralise `$(...)` or
        # backticks. With `type: string` a workflow_dispatch caller could
        # inject shell into a job that holds a token. `workflow_dispatch`
        # already requires write access, so the practical severity was low --
        # but the input does not need to be a string, so it should not be one.
        type: number
  # The cross-repository form of this gate, added for .github#49.
  #
  # A sibling repository calls this as
  # `uses: AI-Ascension/.github/.github/workflows/review-gate.yml@<ref>`
  # and inherits the gate instead of vendoring `tools/review_gate.py` and
  # re-deriving its cases. That distinction is the point: `sts2-harness`
  # *ported* the gate to Rust under its own language rule and carries the
  # port, and the two copies had already diverged in mechanism -- the harness
  # copy was reported failing when only the direct child was killed, which
  # took #702 and #718 to fix, and its test helpers leaked a temp directory
  # (#713, re-introduced by #719). A shared reference has no per-repo port to
  # drift.
  #
  # The caller states WHERE the gate implementation lives, as `gate-repository`
  # and `gate-sha`, and those are the two values it named in its own `uses:`.
  # The gate code and its unit tests are therefore read from the reference at a
  # pinned commit -- never from the pull request's head, and never from the
  # caller's repository. A PR that edits its own review gate still cannot make
  # the gate pass itself, because the caller has no gate code to edit.
  #
  # The pull-request number and repository are NOT inputs. They are read from
  # the caller's own event context, exactly as they are for the direct triggers
  # above, so a caller cannot point the gate at a different pull request than
  # the one being gated.
  workflow_call:
    inputs:
      gate-repository:
        type: string
        default: 'AI-Ascension/.github'
        description: >-
          Repository holding the gate implementation to run. Defaults to this
          repository; a caller passes the same value it named in its `uses:`.
      gate-sha:
        type: string
        default: ''
        description: >-
          The exact commit of `gate-repository` to run. A caller passes the
          same commit it pinned in its `uses:`. Empty means "this
          repository's default branch", which is correct for a direct trigger
          and wrong for a reusable call, so an empty value on a call is caught
          by the test that asserts this input is required rather than
          defaulted.

permissions:
  contents: read
  pull-requests: read

jobs:
  review-of-record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve the trusted gate source
        # A reusable call and a direct trigger have to read DIFFERENT
        # repositories, and getting this wrong is what the `workflow_call`
        # rollout hit on its first live run.
        #
        # Called from a sibling: the gate's code must come from THIS
        # repository, at the commit the caller pinned. The caller's own `main`
        # does not have `tools/review_gate.py` or `tests/test_review_gate.py`
        # at all, so checking out the caller fails at `ModuleNotFoundError: No
        # module named 'tests/test_review_gate'` -- measured on
        # ascension-context-console#43, 2026-09-28.
        #
        # Direct trigger (this repository's own pull requests): the inputs are
        # absent, the defaults apply, and the answer is this repository's own
        # default branch -- the original behaviour.
        #
        # WHY THE CALLER STATES THE PIN AS INPUTS, rather than this step
        # deriving it from the event context. An earlier attempt used
        # `github.event_name == 'workflow_call'` and `github.workflow_sha`.
        # Both are wrong, and the same pilot run measured why: a called
        # workflow INHERITS the caller's event, so inside this job
        # `github.event_name` was `pull_request` and `github.workflow_sha` was
        # the CALLER's merge commit (`4045d5a3`, per the run log). Deriving the
        # trusted source from the event context therefore resolves to the
        # repository the gate is least allowed to trust.
        #
        # An explicit input is the honest fix: the caller already names both
        # values in its `uses:`, and passing them again makes the trusted
        # source visible in the caller's own workflow file, where a review can
        # read it.
        env:
          GATE_REPOSITORY_IN: ${{ inputs.gate-repository }}
          GATE_SHA_IN: ${{ inputs.gate-sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          set -eu
          echo "event=$EVENT"
          echo "workflow_ref=$WORKFLOW_REF"
          echo "gate_repository_in=${GATE_REPOSITORY_IN:-<unset>}"
          echo "gate_sha_in=${GATE_SHA_IN:-<unset>}"
          echo "default_branch=$DEFAULT_BRANCH"
          if [ -n "${GATE_SHA_IN:-}" ]; then
            # A reusable call: use exactly what the caller pinned.
            case "$GATE_SHA_IN" in
              *[!0-9a-f]*|"")
                echo "::error::gate-sha must be a 40-character commit SHA, got: $GATE_SHA_IN"
                exit 1
                ;;
            esac
            if [ "${#GATE_SHA_IN}" -ne 40 ]; then
              echo "::error::gate-sha must be a 40-character commit SHA, got ${#GATE_SHA_IN} characters"
              exit 1
            fi
            {
              echo "GATE_REPOSITORY=$GATE_REPOSITORY_IN"
              echo "GATE_REF=$GATE_SHA_IN"
            } >> "$GITHUB_ENV"
            echo "resolved=reusable-call"
          else
            # A direct trigger in this repository. There is no pin to honour,
            # and the trusted source is this repository's own default branch.
            {
              echo "GATE_REPOSITORY=AI-Ascension/.github"
              echo "GATE_REF=$DEFAULT_BRANCH"
            } >> "$GITHUB_ENV"
            echo "resolved=direct-trigger"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Run the gate from TRUSTED code, never from the pull request.
          #
          # The gate reads the head SHA and the review list from the API; it
          # needs no code from the pull request at all. Checking out the PR head
          # would mean executing code the pull request controls, with a token
          # in the job -- so a PR that edits both `tools/review_gate.py` and
          # `tests/test_review_gate.py` could make the gate pass itself with
          # zero reviews. Pinning the checkout removes that class entirely and
          # costs nothing: everything the gate evaluates comes from the API.
          #
          # For a `workflow_call` the trusted code is this repository at the
          # commit the caller pinned, so `repository` and `ref` come from the
          # step above rather than from the caller's context. For a direct
          # trigger the step above resolves to this repository's own default
          # branch, which is the original behaviour.
          #
          # This is legal on `pull_request` (unlike `pull_request_target`),
          # which is why the gate is not guarded by the
          # `github.ref == default_branch` condition that `metadata-drift.yml`
          # uses -- that workflow only reports, so it can wait for a trusted
          # ref, while this one must answer on every pull request.
          repository: ${{ env.GATE_REPOSITORY }}
          ref: ${{ env.GATE_REF }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the review gate
        run: python -m unittest tests/test_review_gate.py -v
      - name: Require a review pinned to the pull-request head
        # Reviews live on the base repository even when the head is a fork, so
        # this always reads `github.repository` and never the head repo.
        # `github.token` on a `pull_request` event is a read-only token scoped
        # to the pull request, which is all this read needs.
        #
        # The PR number is read from `github.event.pull_request.number` on
        # `pull_request`, and from `github.event.review.pull_request.number` on
        # `pull_request_review` -- that event has no `github.event.pull_request`
        # context at all. Resolving both here keeps the trigger honest: without
        # the second expression this step would pass an empty `--number` and
        # argparse would exit 2 on every review submission.
        #
        # `--number` is parsed as int by argparse, so an unresolved value is a
        # hard error rather than a silent zero. If the number cannot be
        # resolved the job fails, which is the intended fail-closed direction.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="${{ inputs.number || github.event.pull_request.number || github.event.review.pull_request.number }}"
          if [ -z "$number" ]; then
            echo "::error::could not resolve a pull-request number from this event"
            exit 1
          fi
          python tools/review_gate.py \
            --repository "${{ github.repository }}" \
            --number "$number"
