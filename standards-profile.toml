schema_version = 1
profile_id = "org-governance"
repository = "AI-Ascension/.github"
owner = "ORG"
source_bundle = "AI-Ascension/.github"
source_commit = "4d774b58c4e18f7090df5a3799703f52940c998d"
source_digest = "sha256:0a444bf2404d384aabcef34fee47b7ab73b2735c3210b6852ea4a23f1f60f4f0"
distribution = "local"
scopes = [
    "markdown",
    "yaml",
    "json",
    "rust",
]

[checks]
fast = [
    "git-diff-check",
    "standards-validate",
]
required = [
    "standards-fmt",
    "standards-unit-tests",
    "standards-clippy",
    "standards-conformance",
]
extended = ["link-check"]

[checks.commands.git-diff-check]
command = "git diff --check"
target = "."

[checks.commands.link-check]
command = "bash tests/link-check-template.sh"
target = "."

[checks.commands.standards-clippy]
command = "cargo +1.97.1 clippy --locked --manifest-path standards/tools/standards-sync/Cargo.toml --all-targets -- -D warnings"
target = "."

[checks.commands.standards-conformance]
command = "cargo +1.97.1 run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- fixture-check --root standards/conformance"
target = "."

[checks.commands.standards-fmt]
command = "cargo +1.97.1 fmt --manifest-path standards/tools/standards-sync/Cargo.toml --check"
target = "."

[checks.commands.standards-unit-tests]
command = "cargo +1.97.1 test --locked --manifest-path standards/tools/standards-sync/Cargo.toml"
target = "."

[checks.commands.standards-validate]
command = "cargo +1.97.1 run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- validate --root ."
target = "."

[evidence]
runtime = "unverified"
deployment = "unverified"
provider = "unverified"

[exceptions]
file = ""
status = "none"
