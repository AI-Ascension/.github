schema_version: 1
profiles:
  - id: org-governance
    purpose: Governance, documentation, schema, and workflow source for the canonical standards repository.
    scopes: [markdown, yaml, json, rust]
    fast: [git-diff-check, standards-validate]
    required: [standards-lock, schema-shape]
    extended: [link-check]
  - id: rust-pure
    purpose: Host-independent Rust core or contract repository with frozen artifact checks.
    scopes: [rust, json, contracts]
    fast: [git-diff-check, standards-validate, cargo-metadata, cargo-fmt]
    required: [repo-policy-strict, cargo-clippy, cargo-test, artifact-checksums]
    extended: [contract-conformance]
  - id: rust-service
    purpose: Rust gateway, MCP adapter, or harness repository with owned lifecycle and transport seams.
    scopes: [rust, json, contracts]
    fast: [git-diff-check, standards-validate, cargo-metadata, cargo-fmt]
    required: [repo-policy-strict, cargo-clippy, cargo-test, artifact-checksums]
    extended: [contract-conformance, synthetic-boundary-tests]
  - id: rust-managed
    purpose: Rust game-mod repository with a narrow managed/native source-only boundary.
    scopes: [rust, csharp, shell, json, contracts]
    fast: [git-diff-check, standards-validate, cargo-metadata, cargo-fmt]
    required: [repo-policy-strict, cargo-clippy, cargo-test, artifact-checksums, managed-source-probes]
    extended: [managed-bridge-tests, exact-host-build]
  - id: web-php
    purpose: Static site with a PHP subscription endpoint and Composer-managed tests.
    scopes: [html, css, javascript, php]
    fast: [git-diff-check, standards-validate, composer-validate]
    required: [phpunit, origin-regressions, persistence-regressions]
    extended: [browser-check]
  - id: web-static
    purpose: Static HTML/CSS/vanilla JavaScript documentation site with pinned Rust recipes.
    scopes: [html, css, javascript, rust]
    fast: [git-diff-check, standards-validate, node-tests]
    required: [fixture-integrity, local-link-check]
    extended: [browser-check, pinned-recipe]
  - id: operations
    purpose: Shell, Compose, Dockerfile, systemd, and deployment configuration repository.
    scopes: [shell, yaml, dockerfile, systemd]
    fast: [git-diff-check, standards-validate, bash-n, shellcheck]
    required: [compose-invariants, compose-config, dockerfile-check]
    extended: [synthetic-bootstrap]
  - id: planning-bootstrap
    purpose: Prompt or bootstrap repository awaiting an accepted product manifest.
    scopes: [markdown, json, rust-planned, browser-planned]
    fast: [git-diff-check, standards-validate, package-shape]
    required: []
    extended: []
  - id: brand-package
    purpose: Python standard-library prompt package with JSON schemas and offline package checks.
    scopes: [python, html, json, markdown]
    fast: [git-diff-check, standards-validate, python-syntax]
    required: [package-validation, unit-tests, schema-meta-validation]
    extended: [offline-art-board]

