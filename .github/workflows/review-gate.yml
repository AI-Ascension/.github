name: Review of record

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      number:
        description: Pull request number to evaluate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  review-of-record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test the review gate
        run: python -m unittest tests/test_review_gate.py -v
      - name: Require a review pinned to the pull-request head
        # Reviews live on the base repository even when the head is a fork, so
        # this always reads `github.repository` and never the head repo.
        # `github.token` on a `pull_request` event is a read-only token scoped
        # to the pull request, which is all this read needs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="${{ github.event.inputs.number || github.event.pull_request.number }}"
          python tools/review_gate.py \
            --repository "${{ github.repository }}" \
            --number "$number"
