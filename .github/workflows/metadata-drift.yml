name: Metadata drift (read only)

on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  report:
    # Dispatch only trusted default-branch code. Never use pull_request_target
    # or an administrative credential for this reporting workflow.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Read accessible organization metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/metadata.py snapshot --org AI-Ascension --output "$RUNNER_TEMP/live-metadata.json"
      - name: Check out public standards consumer locks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: AI-Ascension/aiascension.tech
          path: ${{ runner.temp }}/consumers/aiascension.tech
          persist-credentials: false
      - name: Check out public Map standards consumer lock
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: AI-Ascension/ascension-map-visualizer
          path: ${{ runner.temp }}/consumers/ascension-map-visualizer
          persist-credentials: false
      - name: Check out public Watchdog standards consumer lock
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: AI-Ascension/ascension-watchdog
          path: ${{ runner.temp }}/consumers/ascension-watchdog
          persist-credentials: false
      - name: Report identity, source-pin, topic, and shared-label drift
        run: python tools/metadata_drift.py --metadata metadata/repositories.yml --labels labels.yml --snapshot "$RUNNER_TEMP/live-metadata.json"
      - name: Check public standards-adoption locks
        run: python tools/standards_adoption.py --ledger metadata/standards-adoption.json --workspace-root "$RUNNER_TEMP/consumers"
