name: Standards baseline

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  standards:
    name: Standards baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned policy toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - name: Validate local pinned standards
        run: cargo +1.97.1 run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- validate --root .
      - name: Check canonical tool and adversarial fixtures
        run: |
          cargo +1.97.1 fmt --manifest-path standards/tools/standards-sync/Cargo.toml --check
          cargo +1.97.1 test --locked --manifest-path standards/tools/standards-sync/Cargo.toml
          cargo +1.97.1 clippy --locked --manifest-path standards/tools/standards-sync/Cargo.toml --all-targets -- -D warnings
          cargo +1.97.1 run --locked --manifest-path standards/tools/standards-sync/Cargo.toml -- fixture-check --root standards/conformance
          bash tests/link-check-template.sh
