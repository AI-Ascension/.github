name: Metadata validation

on:
  pull_request:
    paths:
      - 'metadata/**'
      - 'tools/metadata*'
      - 'tests/**'
      - 'CONTRIBUTING.md'
      - 'labels.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/metadata-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Test metadata tooling without credentials
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate canonical metadata without private snapshots
        run: |
          python tools/metadata.py validate --metadata metadata/repositories.yml --labels labels.yml
      - name: Check existing contribution workflow regression
        run: bash tests/link-check-template.sh
