name: Metadata validation

on:
  pull_request:
    paths:
      - 'metadata/**'
      - 'tools/metadata*'
      - 'tools/standards_adoption.py'
      - 'tests/**'
      - 'reusable-ci/**'
      - 'CONTRIBUTING.md'
      - 'labels.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/metadata-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check out scheduled public standards consumers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AI-Ascension/ascension-map-visualizer
          path: consumers/ascension-map-visualizer
          persist-credentials: false
      - name: Check out scheduled public watchdog standards consumer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AI-Ascension/ascension-watchdog
          ref: bootstrap
          path: consumers/ascension-watchdog
          persist-credentials: false
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Test metadata tooling without credentials
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate canonical metadata without private snapshots
        run: |
          python tools/metadata.py validate --metadata metadata/repositories.yml --labels labels.yml
      - name: Check existing contribution workflow regression
        run: bash tests/link-check-template.sh
      - name: Validate standards-adoption ledger tests
        env:
          STANDARDS_CONSUMER_ROOT: ${{ github.workspace }}/consumers
        run: python -m unittest tests/test_standards_adoption.py -v
